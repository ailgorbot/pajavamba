# Documentation : vérifie la documentation à chaque modification de docs/ sur main et, une fois GitHub Pages
# activé (variable PAGES_ACTIF = true), publie la référence générée et la documentation. Le site VitePress
# (L0-35) remplacera la publication brute.
# Règles : RI-DOC-01, RI-DOC-03 (référence générée), RI-DOC-06, RI-DOC-07 (Pages), RI-GIT-03.
name: docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'README.md', 'tools/reference/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  construction:
    name: Documentation vérifiée et assemblée
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Référence synchronisée, Markdown et orthographe
        run: |
          pnpm reference:check
          pnpm lint:md
          pnpm spell
      - name: Assemblage du site (documentation brute en attendant VitePress)
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          cp README.md _site/index.md
      - if: vars.PAGES_ACTIF == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  publication:
    name: Publication sur GitHub Pages
    if: vars.PAGES_ACTIF == 'true'
    needs: construction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
