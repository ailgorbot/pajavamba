# Intégration continue : types, lint, couches, tests unitaires, référence générée, construction,
# tests de fumée sur la pile conteneurisée (PostgreSQL réel).
# Règles : RI-REV-04 (contrôles bloquants), RI-GIT-03 (actions épinglées par SHA, permissions
# minimales, aucun pull_request_target), RI-DOC-03, RI-TST-05.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Types, lint, couches, tests unitaires, référence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vérification des types (mode strict, couche fonctionnelle sans types Node)
        run: pnpm typecheck
      - name: Tests unitaires
        run: pnpm test
      - name: Référence des actions synchronisée (RI-DOC-03)
        run: pnpm reference:check
      - name: Lint et seuils de code (RI-COD-01 à RI-COD-14)
        run: pnpm lint
      - name: Construction de l'interface (budget JavaScript)
        run: pnpm build:web

  fumee:
    name: Pile conteneurisée et tests de fumée
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Construction et démarrage (secrets générés, migrations, application)
        run: |
          cat > /tmp/ci.override.yaml <<'EOF'
          services:
            pv-app:
              ports: ["18080:8080"]
              environment:
                PV_APP_SECURE_COOKIES: "false"
                PV_APP_HTTPS: "false"
          EOF
          docker compose -p ci -f deploy/compose/compose.yaml -f /tmp/ci.override.yaml up -d --build --wait
      - name: Tests de fumée
        run: |
          docker compose -p ci -f deploy/compose/compose.yaml exec -T pv-app cat /secrets/setup_code > /tmp/setup_code
          node tools/smoke/smoke-test.ts http://127.0.0.1:18080 /tmp/setup_code
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose -p ci -f deploy/compose/compose.yaml logs --no-color
