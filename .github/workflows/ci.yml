# Intégration continue : types, lint, couches, tests unitaires, référence générée, construction,
# tests de fumée sur la pile conteneurisée (PostgreSQL réel).
# Règles : RI-REV-04 (contrôles bloquants), RI-GIT-03 (actions épinglées par SHA, permissions
# minimales, aucun pull_request_target), RI-DOC-03, RI-TST-05.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Secrets, orthographe et Markdown (L0-14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Installation de gitleaks 8.30.1 (empreinte vérifiée)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Secrets dans tout l'historique (RI-SCR-01)
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --config .gitleaks.toml .
      - name: Sentinelle — un jeton PajaVamba fictif est détecté
        run: |
          mkdir -p "$RUNNER_TEMP/sentinelle"
          node -e "const a=(s,n)=>Array.from({length:n},()=>s[Math.floor(Math.random()*s.length)]).join('');const b='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';const c=b+'0';console.log('jeton = pvb_svc_'+a(b,8)+'_'+a(c,43)+'_'+a(c,6))" > "$RUNNER_TEMP/sentinelle/fuite.txt"
          if "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --config .gitleaks.toml "$RUNNER_TEMP/sentinelle"; then echo "::error::gitleaks n'a pas détecté le jeton fictif"; exit 1; fi
      - name: Orthographe française (cspell)
        run: pnpm spell
      - name: Liens internes de la documentation (lychee 0.24.2, empreinte vérifiée)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/lychee.tar.gz" https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  $RUNNER_TEMP/lychee.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP"
          "$(find "$RUNNER_TEMP" -name lychee -type f | head -n 1)" --config lychee.toml --offline 'docs/**/*.md' README.md CONTRIBUTING.md SECURITY.md GOVERNANCE.md CODE_OF_CONDUCT.md 'vault de développement/**/*.md'
      - name: Sentinelle — un commentaire en anglais est signalé
        run: |
          printf '// This function returns the value\nexport const sentinel = 1;\n' > tools/ci/sentinelle-anglais.ts
          if pnpm exec cspell --no-progress tools/ci/sentinelle-anglais.ts; then echo "::error::cspell n'a pas signalé le commentaire en anglais"; exit 1; fi
      - name: Markdown (markdownlint)
        run: pnpm lint:md
      - name: Front-matter de la documentation (RI-DOC-06)
        run: pnpm docs:front-matter

  qualite:
    name: Types, lint, couches, tests unitaires, référence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Fichiers de gouvernance présents (L0-08)
        run: |
          for f in README.md LICENSE SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md GOVERNANCE.md .github/CODEOWNERS; do
            test -s "$f" || { echo "::error::Fichier de gouvernance manquant : $f"; exit 1; }
          done
      - run: pnpm install --frozen-lockfile
      - name: Vérification des types (mode strict, couche fonctionnelle sans types Node)
        run: pnpm typecheck
      - name: Tests unitaires
        run: pnpm test
      - name: Référence des actions synchronisée (RI-DOC-03)
        run: pnpm reference:check
      - name: Lint et seuils de code (RI-COD-01 à RI-COD-14)
        run: pnpm lint
      - name: Formatage Prettier des fichiers modifiés (adoption progressive, ADR-0009)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node tools/ci/format-modifies.ts "origin/$BASE_REF"
      - name: Couches et frontières entre services (dependency-cruiser, RI-ARC-02, RI-SRV-02)
        run: pnpm layers
      - name: Sentinelles qualité (couche interdite, any/enum/export default, fonction de 31 lignes)
        run: sh tools/ci/sentinelles-qualite.sh
      - name: Construction de l'interface (budget JavaScript)
        run: pnpm build:web

  fumee:
    name: Pile conteneurisée et tests de fumée
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Construction et démarrage (secrets générés, migrations, application)
        run: |
          cat > /tmp/ci.override.yaml <<'EOF'
          services:
            pv-app:
              ports: ["18080:8080"]
              environment:
                PV_APP_SECURE_COOKIES: "false"
                PV_APP_HTTPS: "false"
          EOF
          docker compose -p ci -f deploy/compose/compose.yaml -f /tmp/ci.override.yaml up -d --build --wait
      - name: Tests de fumée
        run: |
          docker compose -p ci -f deploy/compose/compose.yaml exec -T pv-app cat /secrets/setup_code > /tmp/setup_code
          node tools/smoke/smoke-test.ts http://127.0.0.1:18080 /tmp/setup_code
      - name: DAST OWASP ZAP passif sur la pile éphémère (RI-SEC-15)
        run: node tools/zap/audit-zap.ts --cible http://pv-app:8080 --reseau ci_default
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose -p ci -f deploy/compose/compose.yaml logs --no-color
